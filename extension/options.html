<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      padding: 16px;
      min-width: 320px;
      color: #333;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #4a9;
    }
    .field {
      margin-bottom: 14px;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 3px;
    }
    button {
      background: #4a9;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #3a8; }
    .status {
      display: inline-block;
      margin-left: 10px;
      color: #4a9;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .status.visible { opacity: 1; }
    .error { color: #c44; }
  </style>
</head>
<body>
  <h2>Golinks Settings</h2>
  <div class="field">
    <label for="serverUrl">Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:8998">
    <div class="hint">The address of your golinks server</div>
  </div>
  <div class="field">
    <label for="interceptPrefix">Intercept Prefix</label>
    <input type="text" id="interceptPrefix" placeholder="go">
    <div class="hint">Typing this prefix in the address bar (e.g. go/keyword) will redirect to the server. The omnibox keyword "go" is always fixed.</div>
  </div>
  <div>
    <button id="save">Save</button>
    <span class="status" id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
